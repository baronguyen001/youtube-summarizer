[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "youtube-summarizer"
version = "0.1.0"
description = "Scriptable YouTube transcript summarizer CLI with Gemini, Claude, or OpenAI-compatible providers."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "baronguyen001" }]
keywords = ["youtube", "transcript", "summary", "summarizer", "gemini", "claude"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Video",
  "Topic :: Text Processing",
]
dependencies = [
  "yt-dlp>=2025.1.15",
  "requests>=2.31",
  "pyyaml>=6.0.1",
]

[project.optional-dependencies]
gemini = ["google-genai>=1.0.0"]
claude = ["anthropic>=0.40.0"]
openai = ["openai>=1.55.0"]
dev = [
  "mypy>=1.11",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.8.0",
  "types-PyYAML>=6.0.12.20240311",
  "types-requests>=2.31.0.20240406",
]

[project.urls]
Homepage = "https://github.com/baronguyen001/youtube-summarizer"
Repository = "https://github.com/baronguyen001/youtube-summarizer"
Issues = "https://github.com/baronguyen001/youtube-summarizer/issues"

[project.scripts]
ytsum = "ytsum.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
line-ending = "lf"

[tool.mypy]
python_version = "3.11"
packages = ["ytsum"]
warn_unused_configs = true
ignore_missing_imports = true
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# -p no:pw_stealth: a broken globally-installed pytest11 entrypoint
# (pw_stealth -> pw_stealth.pytest_plugin, shipped by playwright-cloudflare)
# lives in this machine's Python env and crashes pytest at startup. Disable it.
# pythonpath = src: tests import the `ytsum` package from src/ without needing
# an editable install on the runner.
addopts = "-q -p no:pw_stealth"
pythonpath = ["src"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]
